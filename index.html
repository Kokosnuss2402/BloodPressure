<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Log blood pressure, pulse and blood sugar by taking a photo of your measuring device." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Vitals Log</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 id="view-title">Overview</h1>
        <span id="sync-indicator" class="sync-indicator" hidden></span>
      </header>
      <main id="view" tabindex="-1"></main>
      <nav class="tabbar" aria-label="Main">
        <a href="#/overview" data-tab="overview"><span class="ico" aria-hidden="true">◎</span><span>Overview</span></a>
        <a href="#/history" data-tab="history"><span class="ico" aria-hidden="true">☰</span><span>History</span></a>
        <a href="#/add" class="tab-add" data-tab="add" aria-label="New measurement"><span class="plus" aria-hidden="true">+</span></a>
        <a href="#/charts" data-tab="charts"><span class="ico" aria-hidden="true">∿</span><span>Charts</span></a>
        <a href="#/settings" data-tab="settings"><span class="ico" aria-hidden="true">⚙</span><span>Settings</span></a>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
