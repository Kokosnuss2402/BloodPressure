name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser tests (OCR + end-to-end)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:browser
